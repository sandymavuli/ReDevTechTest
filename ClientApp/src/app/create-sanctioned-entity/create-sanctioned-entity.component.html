<h2 mat-dialog-title>Create Sanctioned Entity</h2>

<mat-dialog-content>
    <form [formGroup]="sanctionEntityForm" (ngSubmit)="onAddEntity()" class="modal-form">

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="sanctionEntityForm.get('name')?.touched && sanctionEntityForm.get('name')?.invalid">
                Name is required.
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Domicile</mat-label>
            <input matInput formControlName="domicile" />
            <mat-error
                *ngIf="sanctionEntityForm.get('domicile')?.touched && sanctionEntityForm.get('domicile')?.invalid">
                Domicile is required.
            </mat-error>
        </mat-form-field>

        <!-- we can even use angular material slide toggle(mat-slide-toggle) instead of bootstrap but as a part of test keeping it-->
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="statusSwitch" formControlName="accepted" />
            <label class="form-check-label" for="statusSwitch">
                {{ sanctionEntityForm.get('accepted')?.value ? 'Accepted' : 'Rejected' }}
            </label>
        </div>

        <mat-dialog-actions align="end" class="mt-3">
            <button mat-button type="button" (click)="onCancel()">Cancel</button>
            <button mat-raised-button color="primary" [disabled]="sanctionEntityForm.invalid" type="submit">Add</button>
        </mat-dialog-actions>

    </form>
</mat-dialog-content>
